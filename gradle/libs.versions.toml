[versions]
agp = "9.4.1"
kotlin = "2.4.21"

libxposed-api = "102.0.0"
libxposed-service = "102.0.0"
meguviz-ref = "1.0.0"
meguviz-ui = "1.0.0"
meguviz-android = "1.1.0"
meguviz-drawable = "1.0.0"
koin = "4.2.2"
palette = "1.0.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
betterandroid = "1.1.6"
dexkit = "2.3.0"
profileinstaller = "1.4.1"
lumen = "1.6.1"
benchmark = "1.5.0"
junit = "4.13.2"
androidx-junit = "1.3.0"
androidx-test-runner = "1.7.0"
espresso = "3.7.0"
uiautomator = "2.4.0"

[libraries]
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed-api" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed-service" }
meguviz-ref-core = { module = "io.github.jichuo1.meguviz:meguviz-ref-core", version.ref = "meguviz-ref" }
meguviz-ui-core = { module = "io.github.jichuo1.meguviz:meguviz-ui-core", version.ref = "meguviz-ui" }
meguviz-android-runtime = { module = "io.github.jichuo1.meguviz:meguviz-android-runtime", version.ref = "meguviz-android" }
meguviz-android-window = { module = "io.github.jichuo1.meguviz:meguviz-android-window", version.ref = "meguviz-android" }
meguviz-drawable-core = { module = "io.github.jichuo1.meguviz:meguviz-drawable-core", version.ref = "meguviz-drawable" }
meguviz-drawable-android = { module = "io.github.jichuo1.meguviz:meguviz-drawable-android", version.ref = "meguviz-drawable" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
androidx-palette-ktx = { module = "androidx.palette:palette-ktx", version.ref = "palette" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
betterandroid-system-extension = { module = "com.highcapable.betterandroid:system-extension", version.ref = "betterandroid" }
dexkit = { module = "org.luckypray:dexkit", version.ref = "dexkit" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
lumen-engine = { module = "com.github.jichuo1.LumenCoacervationEngine:lumen-engine", version.ref = "lumen" }
lumen-motion = { module = "com.github.jichuo1.LumenCoacervationEngine:lumen-motion", version.ref = "lumen" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-test = { id = "com.android.test", version.ref = "agp" }
