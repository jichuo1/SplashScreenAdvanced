# 模块身份与版本
#
# 键名与发布工作流的校验脚本（.github/release-templates/validate_*_build.py）约定一致：
# - project.app.versionName 必须是稳定版基线，形如 MAJOR.MINOR.PATCH，不带预发布后缀。
#   Alpha 版本号由工作流从这里推导出下一个 patch，经 -PsplashScreen.releaseVersionName 传入。
# - project.app.versionCode 是正整数，发布阶段会与 APK 内的实际值逐项比对。
project.app.packageName = com.SplashScreenAdvanced.xposedmodule
project.app.versionName = "1.1.0"
project.app.versionCode = 11

project.android.compileSdk = 37
# Lumen 1.6.x 的 AAR 要求 compileSdk 37.2（API 37 的第二个小版本），低于它 checkAarMetadata 会失败。
# 小版本只影响编译期可用的 API，不改变 targetSdk / minSdk。
project.android.compileSdkMinor = 2
project.android.targetSdk = 37
project.android.minSdk = 34
