name: Android Lint (reusable)

# 完整的 Android Lint 门禁，供 Alpha / Stable 工作流作为与 verify 并行的作业调用（与 BIL 同构）。
#
# 为什么单独成作业：lintDebug 要等 debug 的 Kotlin 编译结束才能开始，随后自身串行，是验证图里最长的
# 一条链；测试、R8 都在它之前跑完，最后一段只剩 lint 在占用 runner。交给另一台 runner 与 verify 同时
# 开始，墙钟时间就从"编译 + lint"之和变成两者中较长的一个。
#
# 检查强度不变：同一个 lintDebug 任务、同样的 lint 基线；发布作业必须同时等 verify 与 lint 都成功。
# Gradle 缓存快照仍由 verify 独家保存，本作业只读，避免两个作业争用同一个缓存键。
on:
  workflow_call:

permissions:
  contents: read

env:
  # 与 alpha-release.yml / stable-release.yml 的同名常量保持一致，test_release_workflow_signing.py 会检查。
  CI_COMPILE_SDK_PACKAGE: 'platforms;android-37.2'
  CI_BUILD_TOOLS: '37.0.0'

jobs:
  lint:
    name: Full Android Lint
    runs-on: ubuntu-latest
    # 防卡死的宽松上限，不是性能预算。
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # 始终检查触发事件记录的精确提交；发布作业会再确认它仍是最新的 main。
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 工程的 sourceCompatibility / jvmTarget 都是 21。
          java-version: '21'

      # 只读恢复：快照由 verify 作业保存，这里不保存。
      - name: Set up Gradle and restore build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # packages 默认值会跑已下架的 `sdkmanager tools`，必须显式声明所需 SDK 包。
          packages: platform-tools ${{ env.CI_COMPILE_SDK_PACKAGE }} build-tools;${{ env.CI_BUILD_TOOLS }}

      - name: Run Android Lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:lintDebug --console=plain --continue

      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-${{ github.sha }}
          path: |
            **/build/reports/lint-results-*
            **/build/intermediates/lint_intermediate_text_report/**/lint-results-*.txt
          if-no-files-found: ignore
          retention-days: 7
